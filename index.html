<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ULTRA MASTER HUB (RGB PRO)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --bg: #030303; --panel: #0a0a0a; --text: #e0e0e0; --accent: #00f3ff; }
        
        /* 144 FPS SMOOTHNESS */
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding-top: 85px; overflow-x: hidden; scroll-behavior: smooth; }
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

        /* MULTI-COLOR RGB ANIMATION */
        @keyframes rgbCycle { 
            0% { border-color: #ff0044; box-shadow: 0 0 15px #ff0044; }
            25% { border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff; }
            50% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            75% { border-color: #ffd700; box-shadow: 0 0 15px #ffd700; }
            100% { border-color: #ff0044; box-shadow: 0 0 15px #ff0044; }
        }

        /* NEON BORDERS */
        .rgb-border { position: relative; border: 2px solid transparent; border-radius: 30px; animation: rgbCycle 6s infinite linear; background: var(--panel); z-index: 1; }
        .inner-panel { padding: 30px; border-radius: 28px; background: var(--panel); height: 100%; }

        /* TOP NAVIGATION */
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; height: 85px; background: rgba(5,5,5,0.95); border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-around; z-index: 5000; backdrop-filter: blur(20px); }
        .nav-tab { color: #555; font-size: 26px; cursor: pointer; padding: 12px 30px; border-radius: 18px; position: relative; }
        .nav-tab.active { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .nav-tab.active::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* PRO INPUTS */
        input, select, textarea { width: 100%; background: #000; border: 1.5px solid #222; color: #fff; padding: 16px; border-radius: 18px; margin-bottom: 20px; font-family: 'Outfit'; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(0, 243, 255, 0.15); }
        label { font-size: 11px; color: #888; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 2px; }

        /* INBUILT MODAL SYSTEM */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-card { background: #080808; width: 90%; max-width: 450px; border-radius: 40px; border: 2px solid var(--accent); overflow: hidden; box-shadow: 0 0 100px rgba(0, 243, 255, 0.2); animation: popIn 0.3s ease; }
        .modal-header { padding: 25px; background: #111; text-align: center; border-bottom: 1px solid #222; font-family: 'Rajdhani'; font-weight: 700; font-size: 22px; color: var(--accent); text-transform: uppercase; }
        .modal-body { max-height: 400px; overflow-y: auto; padding: 15px; }
        
        .list-item { padding: 15px; background: #111; margin-bottom: 8px; border-radius: 15px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent; }
        .list-item:hover { border-color: var(--accent); background: #161616; }

        .btn-neon { background: var(--accent); color: #000; border: none; padding: 18px; width: 100%; border-radius: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 5px 20px rgba(0, 243, 255, 0.2); }
        .btn-neon:active { transform: scale(0.98); }
        
        /* LIST IMAGE STYLE */
        .db-card { background: #0a0a0a; padding: 15px; border-radius: 20px; display: flex; gap: 20px; align-items: center; border: 1px solid #222; margin-bottom: 15px; }
        .db-poster { width: 60px; height: 90px; border-radius: 12px; object-fit: cover; border: 1px solid #333; }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="masterModal" class="modal-overlay">
        <div class="modal-card">
            <div id="mTitle" class="modal-header">NOTIFICATION</div>
            <div id="mBody" class="modal-body"></div>
            <div style="padding: 20px;"><button onclick="closeModal()" class="btn-neon">CLOSE</button></div>
        </div>
    </div>

    <div class="top-nav">
        <div class="nav-tab active" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-line"></i></div>
        <div class="nav-tab" onclick="switchTab('upload')"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="nav-tab" onclick="switchTab('database')"><i class="fa-solid fa-server"></i></div>
        <div class="nav-tab" onclick="switchTab('settings')"><i class="fa-solid fa-sliders"></i></div>
    </div>

    <div style="padding: 25px;">
        <div id="dashboard" class="tab-content">
            <h1 style="font-family:'Rajdhani'; font-size:35px; margin-bottom:30px;">SERVER <span style="color:var(--accent);">ANALYTICS</span></h1>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="rgb-border"><div class="inner-panel">
                    <label>Real-Time Traffic</label>
                    <h2 id="liveViews" style="font-size:50px; margin:0; color:#fff;">0</h2>
                    <small style="color: #00ff00;">● System Active</small>
                </div></div>
                
                <div class="rgb-border"><div class="inner-panel">
                    <label>Total Assets</label>
                    <h2 id="totalMovies" style="font-size:50px; margin:0; color:var(--accent);">0</h2>
                </div></div>
            </div>

            <div class="rgb-border" style="margin-top:25px; border-color: #ff0044 !important;"><div class="inner-panel">
                <label style="color:#ff0044;">SYSTEM HEALTH & ERRORS</label>
                <div id="errorLog" style="font-family:monospace; color:#666; font-size:12px;">No critical errors detected in database integrity.</div>
            </div></div>
        </div>
<div id="upload" class="tab-content" style="display:none;">
            <div class="rgb-border" style="margin-bottom:30px;"><div class="inner-panel" style="padding:20px;">
                <label id="fetchStatus">GLOBAL DEEP SEARCH (MOVIES & SERIES)</label>
                <div style="display:flex; gap:15px;">
                    <input type="text" id="tmdbQuery" placeholder="Enter Name (e.g. Dragon 2025)..." style="margin:0;">
                    <button onclick="fetchTMDB()" style="background:var(--accent); color:#000; border:none; padding:0 30px; border-radius:15px; font-weight:800;">FETCH</button>
                </div>
            </div></div>

            <div class="inner-panel" style="border:1px solid #222;">
                <input type="hidden" id="editId">
                
                <div style="display:grid; grid-template-columns: 110px 1fr; gap:25px;">
                    <div>
                        <img id="posterPreview" src="" style="width:100%; border-radius:15px; min-height:160px; background:#000; object-fit:cover; border:1px solid #333;">
                        <select id="cardBadge" style="margin-top:15px; padding:10px;">
                            <option>4K UHD</option><option>1080p FHD</option><option selected>720p HD</option>
                            <option>480p SD</option><option>CAMRip</option><option>HDRip</option>
                            <option>BluRay</option><option>WEBRip</option><option>IMAX</option><option>HDTC</option>
                        </select>
                    </div>
                    <div>
                        <label>Content Title</label>
                        <input type="text" id="mTitle">
                        
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                            <div>
                                <label>Type</label>
                                <select id="mType" onchange="toggleTypeUI()">
                                    <option value="movie">Movie</option>
                                    <option value="series">Web Series</option>
                                </select>
                            </div>
                            <div id="seasonBox" style="display:none;">
                                <label>Season</label>
                                <input type="number" id="mSeason" value="1">
                            </div>
                        </div>

                        <label>Audio Language (20+)</label>
                        <select id="mLang">
                            <option>Dual Audio</option><option>Bangla Dubbed</option><option>Hindi Dubbed</option>
                            <option>Tamil Dubbed</option><option>Telugu Dubbed</option><option>English Dubbed</option>
                            <option>Korean Dubbed</option><option>Japanese Dubbed</option><option>Spanish Dubbed</option>
                            <option>French Dubbed</option><option>Russian Dubbed</option><option>Hindi Original</option>
                            <option>English Original</option><option>Bengali Original</option><option>Tamil Original</option>
                            <option>Telugu Original</option><option>Malayalam</option><option>Kannada</option><option>Marathi</option>
                            <option>Punjabi</option><option>Multi Audio</option>
                        </select>
                    </div>
                </div>

                <label style="margin-top:15px;">Details Page Note</label>
                <input type="text" id="mNote" placeholder="e.g. Next Episode Coming Soon...">
                <textarea id="mDesc" style="display:none;"></textarea>
                <input type="hidden" id="mGenre"><input type="hidden" id="mRating"><input type="hidden" id="mYear">

                <div style="background:#000; border:2px dashed var(--accent); padding:20px; border-radius:20px; margin-top:20px;">
                    <div style="display:grid; grid-template-columns: 70px 1fr 1fr 50px; gap:10px; align-items:end;">
                        <div id="epBox" style="display:none;"><label>EP</label><input type="number" id="epNum" value="1" style="margin:0;"></div>
                        <div><label>Quality</label><select id="lQual" style="margin:0;"><option>720p</option><option>1080p</option><option>4K</option><option>480p</option></select></div>
                        <div><label id="linkLbl" style="color:var(--accent)">1. Paste Download Link</label><input type="text" id="lLink" style="margin:0;"></div>
                        <button onclick="processLink()" class="btn-neon" style="padding:12px; border-radius:12px;"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
                
                <div id="linkContainer" style="margin-top:20px;"></div>
                <textarea id="finalLinks" style="display:none;"></textarea>

                <div style="display:flex; gap:15px; margin-top:30px;">
                    <button onclick="resetForm()" class="btn-neon" style="background:#222; color:#fff;">RESET</button>
                    <button onclick="publish()" class="btn-neon">PUBLISH CONTENT</button>
                </div>
            </div>
</div>
<div id="database" class="tab-content" style="display:none;">
            <div class="rgb-border"><div class="inner-panel">
                <input type="text" id="dbSearch" placeholder="Search Database..." onkeyup="renderDB()">
                <div id="dbList" style="margin-top:20px;"></div>
            </div></div>
        </div>

        <div id="settings" class="tab-content" style="display:none;">
            <h1>GLOBAL <span style="color:var(--accent);">CONTROL</span></h1>
            <div class="inner-panel" style="border:1px solid #333;">
                <label>Notification Popup Text</label>
                <input type="text" id="sitePopup">
                <button onclick="saveSettings()" class="btn-neon">SAVE CONFIG</button>
            </div>
        </div>
    </div>
<script>
    const config = { apiKey: "AIzaSyDq_l6aCUPm4SQoDbpROnUc7PMn_nF6kPI", databaseURL: "https://pritam-ott-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();
    
    let movies = [], tempLinks = [], linkState = 0, currentDL = "";

    function switchTab(t) { 
        document.querySelectorAll('.tab-content').forEach(e=>e.style.display='none'); 
        document.getElementById(t).style.display='block'; 
        document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if(t === 'database') renderDB();
    }

    function openModal(title, content) {
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mBody').innerHTML = content;
        document.getElementById('masterModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('masterModal').style.display = 'none'; }

    // --- DEEP TMDB FETCH ---
    async function fetchTMDB() {
        const q = document.getElementById('tmdbQuery').value;
        if(!q) return openModal("ALERT", "Please enter a movie or series name!");
        
        try {
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=15d2ea6d0dc1d476efbca3eba2b9bbfb&query=${encodeURIComponent(q)}&language=en-US`);
            const data = await res.json();
            
            let html = data.results.map(i => `
                <div class="list-item" onclick="syncData('${i.media_type}', ${i.id})">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="https://image.tmdb.org/t/p/w200${i.poster_path}" style="width:40px; height:60px; border-radius:5px;">
                        <div>
                            <b>${i.title || i.name}</b><br>
                            <small>${(i.release_date || i.first_air_date || 'N/A').split('-')[0]} • ${i.media_type.toUpperCase()}</small>
                        </div>
                    </div>
                </div>`).join('');
            openModal("SELECT CONTENT", html);
        } catch(e) { openModal("ERROR", "Fetch failed. Check Internet."); }
    }

    async function syncData(type, id) {
        closeModal();
        const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=15d2ea6d0dc1d476efbca3eba2b9bbfb&language=en-US`);
        const i = await res.json();
        
        document.getElementById('mTitle').value = i.title || i.name;
        document.getElementById('mDesc').value = i.overview;
        document.getElementById('posterPreview').src = `https://image.tmdb.org/t/p/w500${i.poster_path}`;
        document.getElementById('mRating').value = i.vote_average;
        document.getElementById('mYear').value = (i.release_date || i.first_air_date || '').split('-')[0];
        document.getElementById('mGenre').value = i.genres.map(g=>g.name).join(", ");
        document.getElementById('mType').value = (type === 'tv') ? 'series' : 'movie';
        toggleTypeUI();
    }

    function toggleTypeUI() {
        const isSeries = document.getElementById('mType').value === 'series';
        document.getElementById('seasonBox').style.display = isSeries ? 'block' : 'none';
        document.getElementById('epBox').style.display = isSeries ? 'block' : 'none';
    }

    // --- DUAL LINK LOGIC (DL -> WATCH) ---
    function processLink() {
        const url = document.getElementById('lLink').value;
        const lbl = document.getElementById('linkStatus');
        if(!url) return;

        if(linkState === 0) { // Download Link Step
            currentDL = url;
            linkState = 1;
            document.getElementById('linkLbl').innerText = "2. PASTE WATCH LINK";
            document.getElementById('linkLbl').style.color = "#00ff00";
            document.getElementById('lLink').value = "";
        } else { // Watch Link Step
            let ep = document.getElementById('mType').value === 'series' ? parseInt(document.getElementById('epNum').value) : 0;
            let qual = document.getElementById('lQual').value;
            
            tempLinks.push({ dl: currentDL, watch: url, qual: qual, ep: ep });
            
            // Auto Increment Episode
            if(ep > 0) document.getElementById('epNum').value = ep + 1;
            
            // Reset State
            linkState = 0;
            document.getElementById('linkLbl').innerText = "1. PASTE DOWNLOAD LINK";
            document.getElementById('linkLbl').style.color = "var(--accent)";
            document.getElementById('lLink').value = "";
            renderLinks();
        }
    }

    function renderLinks() {
        document.getElementById('linkContainer').innerHTML = tempLinks.map((l, i) => `
            <div class="list-item" style="border:1px solid var(--accent); margin-bottom:5px;">
                <span>${l.ep > 0 ? 'EP '+l.ep : 'MOVIE'} • ${l.qual}</span>
                <i class="fa-solid fa-trash" style="color:#ff0044" onclick="removeLink(${i})"></i>
            </div>`).join('');
    }
    function removeLink(i) { tempLinks.splice(i, 1); renderLinks(); }

    // --- DATABASE & PUBLISH ---
    function publish() {
        const id = document.getElementById('editId').value || 'mov_'+Date.now();
        const data = {
            title: document.getElementById('mTitle').value,
            img: document.getElementById('posterPreview').src,
            type: document.getElementById('mType').value,
            season: document.getElementById('mSeason').value,
            lang: document.getElementById('mLang').value,
            quality: document.getElementById('vQuality').value,
            genre: document.getElementById('mGenre').value,
            desc: document.getElementById('mDesc').value,
            note: document.getElementById('mNote').value,
            links: tempLinks,
            timestamp: Date.now()
        };
        
        db.ref('movies/'+id).update(data).then(() => {
            openModal("SUCCESS", "Content Published Successfully!");
            resetForm();
        });
    }

    function resetForm() {
        document.getElementById('mTitle').value = "";
        document.getElementById('posterPreview').src = "";
        tempLinks = []; renderLinks();
        document.getElementById('editId').value = "";
    }

    function renderDB() {
        db.ref('movies').once('value', s => {
            const d = s.val();
            let html = '';
            if(d) {
                Object.keys(d).forEach(k => {
                    const m = d[k];
                    html += `
                        <div class="db-card">
                            <img src="${m.img}" class="db-poster">
                            <div style="flex:1">
                                <b>${m.title}</b><br>
                                <small style="color:var(--accent)">${m.lang} • ${m.quality}</small>
                            </div>
                            <i class="fa-solid fa-pen" style="color:var(--accent); cursor:pointer;" onclick="loadEdit('${k}')"></i>
                            <i class="fa-solid fa-trash" style="color:red; cursor:pointer;" onclick="db.ref('movies/${k}').remove(); renderDB();"></i>
                        </div>`;
                });
            }
            document.getElementById('dbList').innerHTML = html;
        });
    }

    function loadEdit(id) {
        db.ref('movies/'+id).once('value', s => {
            const m = s.val();
            document.getElementById('editId').value = id;
            document.getElementById('mTitle').value = m.title;
            document.getElementById('posterPreview').src = m.img;
            document.getElementById('mType').value = m.type;
            tempLinks = m.links || [];
            renderLinks();
            toggleTypeUI();
            switchTab('upload');
        });
    }

    window.onload = () => {
        db.ref('movies').on('value', s => document.getElementById('totalContent').innerText = s.numChildren());
        // Real Traffic Simulator (Connect your actual analytics here)
        setInterval(() => document.getElementById('liveViews').innerText = Math.floor(Math.random() * 200) + 50, 3000);
    };
</script>
</body>
</html>
