<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 ULTRA ADMIN PRO (MAX CONTROL)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #050505; --glass: #111; --border: #222; --neon: #ff003c; --accent: #00f3ff; --text: #fff; --gold: #ffd700; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', 'Hind Siliguri', sans-serif; margin: 0; overflow-x: hidden; }
        * { box-sizing: border-box; }

        /* SIDEBAR FIXED */
        .sidebar { position: fixed; width: 260px; height: 100%; background: #000; border-right: 1px solid var(--border); padding: 20px; z-index: 1000; transition: 0.3s; }
        .logo { font-size: 22px; font-weight: 800; margin-bottom: 30px; display: block; color: var(--text); }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 15px; margin-bottom: 8px; border-radius: 12px; color: #888; cursor: pointer; transition: 0.3s; }
        .nav-item.active, .nav-item:hover { background: #1a1a1a; color: white; border-left: 4px solid var(--accent); }
        .badge { background: var(--neon); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-left: auto; }

        /* MAIN CONTENT AREA */
        .main-content { margin-left: 260px; padding: 30px; min-height: 100vh; }
        .glass-panel { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        
        input, select, textarea { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; outline: none; }
        label { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 5px; display: block; }

        /* INBUILT MODAL */
        #customPopup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
        .popup-box { background: #111; padding: 25px; border-radius: 15px; border: 1px solid var(--accent); text-align: center; width: 300px; box-shadow: 0 0 30px rgba(0,243,255,0.2); }
        
        .item-card { background: #0a0a0a; padding: 12px; border-radius: 10px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; border: 1px solid #222; }
        .list-img { width: 45px; height: 65px; border-radius: 6px; object-fit: cover; }

        .btn-neon { background: var(--neon); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .edit-btn { color: var(--accent); cursor: pointer; font-size: 20px; border: none; background: none; }
        .del-btn { color: var(--neon); cursor: pointer; font-size: 20px; border: none; background: none; }

        .mobile-toggle { display: none; position: fixed; top: 15px; right: 15px; z-index: 2000; background: var(--neon); color: #fff; border: none; padding: 10px; border-radius: 8px; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 15px; }
            .mobile-toggle { display: block; }
        }
    </style>
</head>
<body>
    <div id="customPopup">
        <div class="popup-box">
            <h3 id="popTitle" style="color:var(--accent); margin:0;"></h3>
            <p id="popMsg" style="font-size:13px; color:#ccc; margin:15px 0;"></p>
            <button onclick="closePop()" class="btn-neon" style="padding:10px;">বন্ধ করুন</button>
        </div>
    </div>

    <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

    <div class="sidebar" id="sidebar">
        <div class="logo">STUDIO <span style="color:var(--accent);">ADMIN</span></div>
        <div class="nav-item active" id="nav-dash" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-line"></i> ড্যাশবোর্ড</div>
        <div class="nav-item" id="nav-add" onclick="switchTab('addMovie')"><i class="fa-solid fa-cloud-arrow-up"></i> মুভি আপলোড</div>
        <div class="nav-item" id="nav-list" onclick="switchTab('manageMovies')"><i class="fa-solid fa-database"></i> মুভি লিস্ট</div>
        <div class="nav-item" id="nav-set" onclick="switchTab('siteControl')"><i class="fa-solid fa-pen-nib"></i> সাইট টেক্সট এডিট</div>
        <div class="nav-item" id="nav-req" onclick="switchTab('requests')"><i class="fa-solid fa-bell"></i> রিকোয়েস্ট <span id="reqBadge" class="badge">0</span></div>
    </div>

    <div class="main-content">
        <div id="dashboard" class="tab-content">
            <h1>📊 এক নজরে</h1>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div class="glass-panel">মুভি সংখ্যা: <h2 id="totalMovies" style="margin:0;">0</h2></div>
                <div class="glass-panel">মোট ভিউ: <h2 id="totalViews" style="margin:0; color:var(--accent);">0</h2></div>
            </div>
        </div>

        <div id="siteControl" class="tab-content" style="display:none;">
            <h1>✒️ ওয়েবসাইট টেক্সট পরিবর্তন</h1>
            <div class="glass-panel">
                <label>টাইটেল (PREMIUM MOVIE STUDIO)</label>
                <input type="text" id="siteTitleInput">
                <label>সাব-টাইটেল (ULTIMATE COLLECTION)</label>
                <input type="text" id="siteSubInput">
                <button onclick="saveSiteConfig()" class="btn-neon" style="width:auto; padding:10px 30px;">সেভ করুন</button>
            </div>
        </div>
<div id="addMovie" class="tab-content" style="display:none;">
            <h1>🚀 মুভি ম্যানেজার</h1>
            <div class="glass-panel" style="border-color:var(--accent);">
                <label id="fetchStatus">যেকোনো পুরাতন মুভি খুঁজতে নাম লিখুন</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="tmdbQuery" placeholder="মুভির নাম..." style="margin:0;">
                    <button onclick="fetchTMDB()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer;">FETCH</button>
                </div>
            </div>

            <div class="glass-panel">
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
                    <input type="text" id="mTitle" placeholder="মুভির নাম">
                    <input type="text" id="mRating" placeholder="রেটিং">
                </div>
                <div style="display:grid; grid-template-columns: 1fr 2fr; gap:15px;">
                    <div>
                        <img id="posterPreview" src="" style="width:100%; border-radius:10px; border:1px solid #333; min-height:150px; background:#000; object-fit:cover;">
                        <input type="text" id="mImg" placeholder="পোস্টার লিঙ্ক">
                        <label>মুভি কার্ড ব্যাজ</label>
                        <select id="mRes">
                            <option value="4K UHD">🌟 4K UHD</option>
                            <option value="1080p FHD">💎 1080p FHD</option>
                            <option value="720p HD" selected>📺 720p HD</option>
                            <option value="HDRip">🌈 HDRip</option>
                            <option value="BluRay">💿 BluRay</option>
                        </select>
                    </div>
                    <div>
                        <textarea id="mDesc" style="height:110px;" placeholder="ডেসক্রিপশন..."></textarea>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                            <input type="text" id="mGenre" placeholder="জেনরা">
                            <select id="mLang">
                                <option value="Dual Audio">Dual Audio (Hin-Eng)</option>
                                <option value="Bangla Dubbed">Bangla Dubbed</option>
                                <option value="Bengali">Bengali</option>
                                <option value="Hindi">Hindi</option>
                                <option value="English">English</option>
                                <option value="South Hindi Dubbed">South Hindi Dubbed</option>
                                <option value="Multi Audio">Multi Audio (4+ Lang)</option>
                                <option value="Tamil">Tamil</option>
                                <option value="Korean">Korean</option>
                                <option value="Bhojpuri">Bhojpuri</option>
                            </select>
                        </div>
                        <input type="text" id="mNote" placeholder="হলুদ বক্সের নোটিশ...">
                    </div>
                </div>
                <button onclick="saveMovie()" class="btn-neon" style="margin-top:10px;">PUBLISH CONTENT</button>
            </div>
        </div>

        <div id="manageMovies" class="tab-content" style="display:none;">
            <h1>📂 ডাটাবেস লিস্ট</h1>
            <input type="text" id="searchList" placeholder="মুভি খুঁজুন..." onkeyup="renderList()">
            <div id="movieListContainer" style="margin-top:15px;"></div>
        </div>

        <div id="requests" class="tab-content" style="display:none;">
            <h1>🔔 রিকোয়েস্ট লিস্ট</h1>
            <div id="reqList"></div>
        </div>
    </div>
<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDq_l6aCUPm4SQoDbpROnUc7PMn_nF6kPI", 
        authDomain: "pritam-ott.firebaseapp.com", 
        databaseURL: "https://pritam-ott-default-rtdb.firebaseio.com", 
        projectId: "pritam-ott", 
        storageBucket: "pritam-ott.firebasestorage.app", 
        messagingSenderId: "8916733532", 
        appId: "1:8916733532:web:8b1143a7352770ff7e6099" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allMovies = [];

    function showPop(t, m) { document.getElementById('popTitle').innerText=t; document.getElementById('popMsg').innerText=m; document.getElementById('customPopup').style.display='flex'; }
    function closePop() { document.getElementById('customPopup').style.display='none'; }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

    function switchTab(t) { 
        document.querySelectorAll('.tab-content').forEach(e=>e.style.display='none'); 
        document.getElementById(t).style.display='block'; 
        document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
        if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('active');
    }

    async function fetchTMDB() {
        const q = document.getElementById('tmdbQuery').value;
        if(!q) return showPop("ভুল", "মুভির নাম লিখুন!");
        const status = document.getElementById('fetchStatus');
        status.innerHTML = "🔍 <span style='color:var(--accent)'>Please wait, data fetching...</span>";
        
        try {
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=15d2ea6d0dc1d476efbca3eba2b9bbfb&query=${q}&language=en-US`);
            const data = await res.json();
            if(data.results?.[0]) {
                const info = data.results[0];
                document.getElementById('mTitle').value = info.title || info.name;
                const img = `https://image.tmdb.org/t/p/w500${info.poster_path}`;
                document.getElementById('mImg').value = img;
                document.getElementById('posterPreview').src = img;
                document.getElementById('mRating').value = (info.vote_average || 0).toFixed(1);
                
                const resBn = await fetch(`https://api.themoviedb.org/3/${info.media_type}/${info.id}?api_key=15d2ea6d0dc1d476efbca3eba2b9bbfb&language=bn-BD`);
                const dataBn = await resBn.json();
                document.getElementById('mDesc').value = dataBn.overview || info.overview;
                
                status.innerHTML = "✅ <span style='color:#00ff88'>তথ্য পাওয়া গেছে!</span>";
            } else {
                showPop("দুঃখিত", "মুভিটি খুঁজে পাওয়া যায়নি!");
                status.innerText = "Fetch from TMDB";
            }
        } catch(e) { showPop("এরর", "সার্ভার সমস্যা!"); }
    }

    function renderList() {
        const s = document.getElementById('searchList').value.toLowerCase();
        const list = allMovies.filter(m => (m.title||"").toLowerCase().includes(s));
        document.getElementById('movieListContainer').innerHTML = list.map(m => `
            <div class="item-card">
                <img src="${m.img}" class="list-img">
                <div style="flex:1"><b>${m.title}</b><br><small style="color:#666">${m.res || 'HD'}</small></div>
                <div style="display:flex; gap:10px;">
                    <button onclick="editMovie('${m.id}')" class="edit-btn"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button onclick="deleteMovie('${m.id}')" class="del-btn"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>`).join('');
    }

    function saveMovie() {
        const id = document.getElementById('editId').value || 'mov_' + Date.now();
        const data = {
            title: document.getElementById('mTitle').value,
            img: document.getElementById('mImg').value,
            desc: document.getElementById('mDesc').value,
            rating: document.getElementById('mRating').value,
            res: document.getElementById('mRes').value,
            lang: document.getElementById('mLang').value,
            genre: document.getElementById('mGenre').value,
            note: document.getElementById('mNote').value,
            uploadTime: new Date().toISOString()
        };
        db.ref('movies/' + id).update(data).then(() => {
            showPop("সফল", "মুভি আপলোড/আপডেট হয়েছে!");
            clearForm();
            switchTab('manageMovies');
        });
    }

    function editMovie(id) {
        const m = allMovies.find(x => x.id === id);
        if(!m) return;
        document.getElementById('editId').value = m.id;
        document.getElementById('mTitle').value = m.title;
        document.getElementById('mImg').value = m.img;
        document.getElementById('posterPreview').src = m.img;
        document.getElementById('mDesc').value = m.desc;
        document.getElementById('mRating').value = m.rating;
        document.getElementById('mGenre').value = m.genre || "";
        switchTab('addMovie');
    }

    function deleteMovie(id) { if(confirm("মুছে ফেলবেন?")) db.ref('movies/'+id).remove().then(()=>showPop("মুছে গেছে", "মুভিটি ডিলিট হয়েছে।")); }

    function saveSiteConfig() {
        const t = document.getElementById('siteTitleInput').value;
        const s = document.getElementById('siteSubInput').value;
        db.ref('siteConfig').set({ title: t, subTitle: s }).then(() => showPop("সফল", "সাইট টেক্সট সেভ হয়েছে!"));
    }

    function clearForm() { 
        document.getElementById('editId').value = "";
        document.querySelectorAll('input, textarea').forEach(i => i.value = "");
        document.getElementById('posterPreview').src = "";
    }

    window.onload = () => {
        db.ref('movies').on('value', s => {
            allMovies = []; const d = s.val();
            if(d) for(let k in d) allMovies.push({id:k, ...d[k]});
            allMovies.sort((a,b) => new Date(b.uploadTime) - new Date(a.uploadTime));
            document.getElementById('totalMovies').innerText = allMovies.length;
            renderList();
        });
        db.ref('movieClicks').on('value', s => {
            let t = 0, d = s.val(); if(d) for(let k in d) t += d[k];
            document.getElementById('totalViews').innerText = t;
        });
        db.ref('requests').on('value', s => {
            const count = s.numChildren();
            document.getElementById('reqBadge').innerText = count;
            const d = s.val(); let h = '';
            if(d) for(let k in d) h += `<div class="item-card"><div><b>${d[k].movieName}</b><br><small>${d[k].userName}</small></div><button onclick="db.ref('requests/${k}').remove()" class="action-btn del-btn" style="margin-left:auto">Done</button></div>`;
            document.getElementById('reqList').innerHTML = h || 'কোনো রিকোয়েস্ট নেই';
        });
    };
</script>
</body>
</html>
