<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 PRITAM ADMIN PRO (FULLY AUTOMATIC)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #050505; --glass: #111; --border: #222; --neon: #ff003c; --accent: #00f3ff; --text: #fff; --gold: #ffd700; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', 'Hind Siliguri', sans-serif; margin: 0; overflow-x: hidden; }
        * { box-sizing: border-box; }

        .sidebar { position: fixed; width: 260px; height: 100%; background: #000; border-right: 1px solid var(--border); padding: 20px; z-index: 1000; transition: 0.3s; }
        .logo { font-size: 22px; font-weight: 800; margin-bottom: 30px; display: block; color: var(--text); border-bottom: 2px solid var(--neon); padding-bottom: 10px; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 15px; margin-bottom: 8px; border-radius: 12px; color: #888; cursor: pointer; transition: 0.3s; }
        .nav-item.active, .nav-item:hover { background: #1a1a1a; color: white; border-left: 4px solid var(--accent); }
        .badge { background: var(--neon); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-left: auto; }

        .main-content { margin-left: 260px; padding: 30px; transition: 0.3s; min-height: 100vh; }
        .glass-panel { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        input, select, textarea { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; outline: none; font-size: 13px; }
        label { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 5px; display: block; }

        /* BUILDER BOX */
        .builder-box { background: #0a0a0a; border: 1px solid var(--accent); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .added-item { background: #1a1a1a; padding: 10px; margin-bottom: 5px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #333; }
        
        .list-img { width: 45px; height: 65px; border-radius: 6px; object-fit: cover; background: #222; }
        .btn-neon { background: var(--neon); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .action-btn { background: none; border: none; font-size: 18px; cursor: pointer; margin-left: 10px; padding: 5px; }
        .edit-btn { color: var(--accent); }
        .del-btn { color: var(--neon); }

        #customPopup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
        .popup-box { background: #111; padding: 25px; border-radius: 15px; border: 1px solid var(--accent); text-align: center; width: 320px; }

        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.active { transform: translateX(0); } .main-content { margin-left: 0; padding: 15px; } }
    </style>
</head>
<body>
    <div id="customPopup">
        <div class="popup-box">
            <h3 id="popTitle" style="color:var(--accent); margin-top:0;"></h3>
            <p id="popMsg" style="font-size:13px; color:#ccc;"></p>
            <button onclick="closePop()" class="btn-neon" style="padding:10px;">বন্ধ করুন</button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="logo">STUDIO <span style="color:var(--accent);">ADMIN</span></div>
        <div class="nav-item active" id="nav-dash" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-line"></i> ড্যাশবোর্ড</div>
        <div class="nav-item" id="nav-add" onclick="switchTab('addMovie')"><i class="fa-solid fa-cloud-arrow-up"></i> মুভি আপলোড</div>
        <div class="nav-item" id="nav-list" onclick="switchTab('manageMovies')"><i class="fa-solid fa-database"></i> মুভি লিস্ট</div>
        <div class="nav-item" id="nav-set" onclick="switchTab('siteControl')"><i class="fa-solid fa-gears"></i> সাইট কন্ট্রোল</div>
    </div>

    <div class="main-content">
        <div id="dashboard" class="tab-content">
            <h1>📊 পরিসংখ্যান</h1>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div class="glass-panel">মুভি সংখ্যা: <h2 id="totalMovies" style="margin:0;">0</h2></div>
                <div class="glass-panel">মোট ভিউ: <h2 id="totalViews" style="margin:0; color:var(--accent);">0</h2></div>
            </div>
        </div>

        <div id="siteControl" class="tab-content" style="display:none;">
            <h1>⚙️ সাইট টেক্সট পরিবর্তন</h1>
            <div class="glass-panel">
                <label>টাইটেল (PREMIUM MOVIE STUDIO)</label>
                <input type="text" id="siteTitleInput">
                <label>সাব-টাইটেল (ULTIMATE COLLECTION)</label>
                <input type="text" id="siteSubInput">
                <button onclick="saveSiteConfig()" class="btn-neon" style="width:auto; padding:10px 30px;">সেভ করুন</button>
            </div>
        </div>

        <div id="addMovie" class="tab-content" style="display:none;">
            <h1>🚀 মুভি ম্যানেজার</h1>
            <div class="glass-panel" style="border-color:var(--accent);">
                <label id="fetchStatus">যেকোনো পুরাতন মুভি খুঁজতে নাম লিখুন</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="tmdbQuery" placeholder="মুভির নাম..." style="margin:0;">
                    <button onclick="fetchTMDB()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; color:#000;">FETCH</button>
                </div>
            </div>

            <div class="glass-panel">
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
                    <input type="text" id="mTitle" placeholder="টাইটেল">
                    <input type="text" id="mRating" placeholder="রেটিং (e.g. 8.5)" style="color:gold;">
                </div>
                
                <div style="display:grid; grid-template-columns: 1fr 2fr; gap:15px;">
                    <div>
                        <img id="posterPreview" src="" style="width:100%; border-radius:10px; border:1px solid #333; min-height:150px; background:#000; object-fit:cover;">
                        <input type="text" id="mImg" placeholder="পোস্টার লিঙ্ক" oninput="document.getElementById('posterPreview').src=this.value">
                        <label>মুভি কার্ড ব্যাজ</label>
                        <select id="mRes">
                            <option value="4K UHD">🌟 4K UHD</option>
                            <option value="1080p FHD">💎 1080p FHD</option>
                            <option value="720p HD" selected>📺 720p HD</option>
                            <option value="BluRay">💿 BluRay</option>
                            <option value="HDRip">🌈 HDRip</option>
                        </select>
                    </div>
                    <div>
                        <textarea id="mDesc" style="height:110px;" placeholder="ডেসক্রিপশন..."></textarea>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                            <input type="text" id="mGenre" placeholder="জেনরা">
                            <select id="mLang">
                                <option value="Dual Audio">Dual Audio (Hin-Eng)</option>
                                <option value="Bangla Dubbed">Bangla Dubbed</option>
                                <option value="Hindi">Hindi</option>
                                <option value="Bengali">Bengali</option>
                                <option value="English">English</option>
                                <option value="Multi Audio">Multi Audio (4+ Lang)</option>
                                <option value="Tamil">Tamil</option>
                                <option value="Korean">Korean</option>
                            </select>
                        </div>
                        <input type="text" id="mNote" placeholder="হলুদ বক্সের নোটিশ...">
                        <select id="mType" onchange="toggleTypeView()"><option value="movie">মুভি</option><option value="series">ওয়েব সিরিজ</option></select>
                    </div>
                </div>

                <div class="builder-box">
                    <label style="color:var(--accent);">লিঙ্ক যোগ করুন (1st click = Download, 2nd click = Watch)</label>
                    <div style="display:grid; grid-template-columns: 80px 100px 1fr 45px; gap:8px; align-items:center;">
                        <input type="number" id="manualEp" value="1" placeholder="Ep">
                        <select id="manualQual">
                            <option value="720p">720p</option><option value="1080p">1080p</option><option value="4K UHD">4K UHD</option>
                        </select>
                        <input type="text" id="manualLink" placeholder="পেস্ট লিঙ্ক..." style="margin:0;">
                        <button onclick="addManualLink()" style="background:var(--accent); border:none; height:40px; border-radius:8px; cursor:pointer;"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>

                <div id="addedItemsList" style="margin-bottom:15px;"></div>
                <textarea id="mContent" style="display:none;"></textarea>
                <button onclick="saveMovie()" class="btn-neon">পাবলিশ করুন</button>
            </div>
        </div>

        <div id="manageMovies" class="tab-content" style="display:none;">
            <h1>📂 ডাটাবেস এডিট ও ডিলিট</h1>
            <input type="text" id="searchList" placeholder="সার্চ মুভি..." onkeyup="renderList()" style="margin-bottom:15px;">
            <div id="movieListContainer"></div>
        </div>
    </div>
<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDq_l6aCUPm4SQoDbpROnUc7PMn_nF6kPI", 
        authDomain: "pritam-ott.firebaseapp.com", 
        databaseURL: "https://pritam-ott-default-rtdb.firebaseio.com", 
        projectId: "pritam-ott", 
        storageBucket: "pritam-ott.firebasestorage.app", 
        messagingSenderId: "8916733532", 
        appId: "1:8916733532:web:8b1143a7352770ff7e6099" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let allMovies = [], tempLinks = [], currentPair = { dl: "", watch: "" };

    function showPop(t, m) { document.getElementById('popTitle').innerText=t; document.getElementById('popMsg').innerText=m; document.getElementById('customPopup').style.display='flex'; }
    function closePop() { document.getElementById('customPopup').style.display='none'; }

    function switchTab(t) { 
        document.querySelectorAll('.tab-content').forEach(e=>e.style.display='none'); 
        document.getElementById(t).style.display='block'; 
        document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
    }

    async function fetchTMDB() {
        const q = document.getElementById('tmdbQuery').value;
        if(!q) return showPop("ভুল", "মুভির নাম লিখুন!");
        const status = document.getElementById('fetchStatus');
        status.innerHTML = "🔍 <span style='color:var(--accent)'>Please wait, searching database...</span>";
        
        try {
            // Enhanced searching with global fallback
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=15d2ea6d0dc1d476efbca3eba2b9bbfb&query=${encodeURIComponent(q)}&language=en-US`);
            const data = await res.json();
            
            if(data.results && data.results.length > 0) {
                const info = data.results[0];
                document.getElementById('mTitle').value = info.title || info.name;
                const imgUrl = info.poster_path ? `https://image.tmdb.org/t/p/w500${info.poster_path}` : '';
                document.getElementById('mImg').value = imgUrl;
                document.getElementById('posterPreview').src = imgUrl;
                document.getElementById('mRating').value = (info.vote_average || 0).toFixed(1);
                
                // Fetch Description in Bengali
                const resBn = await fetch(`https://api.themoviedb.org/3/${info.media_type}/${info.id}?api_key=15d2ea6d0dc1d476efbca3eba2b9bbfb&language=bn-BD`);
                const dataBn = await resBn.json();
                document.getElementById('mDesc').value = dataBn.overview || info.overview || "Description not found.";
                
                status.innerHTML = "✅ <span style='color:#00ff88'>Data Loaded Successfully!</span>";
            } else {
                showPop("Not Found", "মুভিটি খুঁজে পাওয়া যায়নি!");
                status.innerText = "Fetch from TMDB";
            }
        } catch(e) { showPop("Error", "সার্ভার কানেকশন সমস্যা!"); }
    }
</script>
<script>
    function toggleTypeView() {
        const type = document.getElementById('mType').value;
        document.getElementById('manualEp').style.display = (type === 'series') ? 'block' : 'none';
    }

    function addManualLink() {
        const link = document.getElementById('manualLink').value.trim();
        const qual = document.getElementById('manualQual').value;
        const ep = parseInt(document.getElementById('manualEp').value);
        if(!link) return;

        if (!currentPair.dl) {
            currentPair.dl = link;
            document.getElementById('pairStatus').innerHTML = "অপেক্ষা করছি: <b style='color:var(--neon)'>WATCH LINK</b> এর জন্য";
            document.getElementById('manualLink').value = "";
        } else {
            currentPair.watch = link;
            tempLinks.push({ ep: ep, qual: qual, dl: currentPair.dl, watch: currentPair.watch });
            currentPair = { dl: "", watch: "" };
            document.getElementById('pairStatus').innerHTML = "অপেক্ষা করছি: <b style='color:var(--accent)'>DOWNLOAD LINK</b> এর জন্য";
            document.getElementById('manualLink').value = "";
            if(document.getElementById('mType').value === 'series') document.getElementById('manualEp').value = ep + 1;
            renderAddedUI(); updateJSON();
        }
    }

    function renderAddedUI() {
        const list = document.getElementById('addedItemsList');
        const type = document.getElementById('mType').value;
        list.innerHTML = tempLinks.map((item, i) => `
            <div class="added-item">
                <div style="font-size:12px;">
                    ${type==='series' ? '<b>Ep '+item.ep+'</b>' : '<b>Movie</b>'} [${item.qual}]<br>
                    <small style="color:#666">DL: ${item.dl.substring(0,30)}...</small>
                </div>
                <i class="fa-solid fa-trash-can edit-btn" onclick="tempLinks.splice(${i},1);renderAddedUI();updateJSON();"></i>
            </div>`).join('');
    }

    function updateJSON() {
        const type = document.getElementById('mType').value;
        let finalJSON = [];
        if(type === 'movie') {
            finalJSON = tempLinks.map(t => ({ qual: t.qual, size: "N/A", watch: t.watch, dl: t.dl }));
        } else {
            let map = {};
            tempLinks.forEach(t => {
                if(!map[t.ep]) map[t.ep] = { epNum: t.ep, qualities: [] };
                map[t.ep].qualities.push({ qual: t.qual, size: "N/A", watch: t.watch, dl: t.dl });
            });
            finalJSON = Object.values(map);
        }
        document.getElementById('mContent').value = JSON.stringify(finalJSON);
    }

    function saveMovie() {
        const id = document.getElementById('editId').value || 'mov_' + Date.now();
        const data = {
            title: document.getElementById('mTitle').value, img: document.getElementById('mImg').value,
            desc: document.getElementById('mDesc').value, rating: document.getElementById('mRating').value,
            res: document.getElementById('mRes').value, lang: document.getElementById('mLang').value,
            type: document.getElementById('mType').value, note: document.getElementById('mNote').value,
            uploadTime: new Date().toISOString(), content: JSON.parse(document.getElementById('mContent').value || '[]')
        };
        db.ref('movies/' + id).update(data).then(() => { showPop("Success", "মুভি সেভ হয়েছে!"); location.reload(); });
    }

    function renderList() {
        const s = document.getElementById('searchList').value.toLowerCase();
        const list = allMovies.filter(m => (m.title||"").toLowerCase().includes(s));
        document.getElementById('movieListContainer').innerHTML = list.map(m => `
            <div class="item-card">
                <img src="${m.img}" class="list-img">
                <div style="flex:1"><b>${m.title}</b><br><small style="color:#666">${m.type}</small></div>
                <div style="display:flex;">
                    <i class="fa-solid fa-pen-to-square edit-btn" onclick="editMovie('${m.id}')"></i>
                    <i class="fa-solid fa-trash-can del-btn" onclick="deleteMovie('${m.id}')"></i>
                </div>
            </div>`).join('');
    }

    function editMovie(id) {
        const m = allMovies.find(x => x.id === id);
        document.getElementById('editId').value = m.id;
        document.getElementById('mTitle').value = m.title;
        document.getElementById('mImg').value = m.img;
        document.getElementById('posterPreview').src = m.img;
        document.getElementById('mContent').value = JSON.stringify(m.content);
        switchTab('addMovie');
    }

    function deleteMovie(id) { if(confirm("Permanently delete?")) db.ref('movies/'+id).remove(); }
    function saveSiteConfig() { db.ref('siteConfig').set({ title: document.getElementById('siteTitleInput').value, sub: document.getElementById('siteSubInput').value }).then(()=>showPop("Success", "Updated!")); }

    window.onload = () => {
        db.ref('movies').on('value', s => {
            allMovies = []; const d = s.val();
            if(d) for(let k in d) allMovies.push({id:k, ...d[k]});
            document.getElementById('totalMovies').innerText = allMovies.length;
            renderList();
        });
        db.ref('movieClicks').on('value', s => { let t = 0, d = s.val(); if(d) for(let k in d) t += d[k]; document.getElementById('totalViews').innerText = t; });
    };
</script>
</body>
</html>
