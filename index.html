<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ GOD MODE MASTER HUB (FINAL)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen">
        <div class="rgb-border">
            <div class="inner-panel" style="text-align:center; width:320px;">
                <h2 style="color:var(--cyan); font-family:'Rajdhani';">SECURE ACCESS</h2>
                <input type="email" id="usrInput" placeholder="ADMIN EMAIL" style="text-align:center;">
                <input type="password" id="passInput" placeholder="PASSWORD" style="text-align:center;">
                <button onclick="checkLogin()" class="btn-cyan">UNLOCK</button>
                <p id="loginMsg" style="color:red; font-size:12px; margin-top:10px;"></p>
            </div>
        </div>
    </div>

    <div id="mainApp">
        <div id="masterModal" class="modal-overlay">
            <div class="modal-card">
                <div id="modalTitle" class="modal-header">NOTIFICATION</div>
                <div id="modalBody" class="modal-body"></div>
                <div class="modal-footer" style="padding:20px;"><button onclick="closeModal()" class="btn-cyan">CLOSE</button></div>
            </div>
        </div>

        <div class="top-nav">
            <div class="nav-tab active" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-line"></i></div>
            <div class="nav-tab" onclick="switchTab('inbox')"><i class="fa-solid fa-bell"></i><span id="notifBadge" style="position:absolute; top:12px; right:15px; width:8px; height:8px; background:red; border-radius:50%; display:none;"></span></div>
            <div class="nav-tab" onclick="switchTab('upload')"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <div class="nav-tab" onclick="switchTab('database')"><i class="fa-solid fa-server"></i></div>
            <div class="nav-tab" onclick="switchTab('automation')"><i class="fa-solid fa-robot"></i></div>
            <div class="nav-tab" onclick="switchTab('excelmaker')"><i class="fa-solid fa-table"></i></div>
        </div>

        <div style="padding: 20px;">
            
            <div id="dashboard" class="tab-content">
                <h1 style="font-family:'Rajdhani';">DASHBOARD <span style="font-size:12px; color:var(--cyan)">V5.0 PRO</span></h1>
                <div class="rgb-border" style="margin-bottom:20px; border-color:#00ff00 !important;">
                    <div class="inner-panel" style="padding:15px; display:flex; justify-content:space-between; align-items:center;">
                        <div><label style="margin:0; font-size:12px;">SYSTEM STATUS</label><h2 style="margin:0; color:#00ff00;">ONLINE & SECURE</h2></div>
                        <i class="fa-solid fa-shield-halved" style="font-size:30px; color:#00ff00;"></i>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom: 20px;">
                    <div class="rgb-border"><div class="inner-panel"><label>Total Content</label><h2 id="totalMovies" style="font-size:40px; margin:0;">0</h2></div></div>
                    <div class="rgb-border"><div class="inner-panel"><label>Reports</label><h2 id="pendingReports" style="font-size:40px; margin:0; color:var(--red);">0</h2></div></div>
                </div>
            </div> 

                        <div id="excelmaker" class="tab-content" style="display:none;">
                <div class="rgb-border" style="border-color:var(--cyan) !important;">
                    <div class="inner-panel">
                        <label style="color:var(--cyan); font-weight:bold;"><i class="fa-solid fa-wand-magic-sparkles"></i> SMART TITLE GENERATOR</label>
                        
                        <div style="background:#111; padding:15px; border-radius:15px; margin-top:15px; border:1px solid #333;">
                            
                            <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                                <img id="genThumb" src="https://via.placeholder.com/45x65" style="width:50px; height:75px; object-fit:cover; border-radius:5px; border:1px solid #333; display:none;"> 
                                <div style="flex:2;">
                                    <label>Movie Name (Clean)</label>
                                    <input type="text" id="genTitle" placeholder="e.g. Pathan" onkeyup="generateSmartTitle()" onchange="autoFetchYearForExcel()">
                                </div>
                                <div style="flex:1;">
                                    <label>Year</label>
                                    <input type="text" id="genYear" placeholder="Auto" onkeyup="generateSmartTitle()">
                                </div>
                            </div>

                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                                <div><label>Quality</label><select id="genQual" onchange="generateSmartTitle()"><option>720p HD</option><option>1080p FHD</option><option>4K UHD</option><option>480p SD</option></select></div>
                                <div><label>Audio</label><select id="genAudio" onchange="generateSmartTitle()"><option>Hindi</option><option>Dual Audio</option><option>Multi Audio</option><option>English</option><option>Bengali</option></select></div>
                            </div>
                            
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                                <div><label>Source</label><select id="genSource" onchange="generateSmartTitle()"><option>Web-DL</option><option>BluRay</option><option>HDRip</option><option>CAMRip</option></select></div>
                                <div>
                                    <label style="color:var(--gold);">File Size</label>
                                    <input type="text" id="genSize" placeholder="e.g. 1.4 GB" style="border-color:var(--gold);">
                                </div>
                            </div>

                            <div style="background:#000; border:1px solid var(--gold); padding:10px; border-radius:5px; margin-bottom:15px;">
                                <label style="color:var(--gold); font-size:10px;">FINAL DISPLAY TITLE:</label>
                                <input type="text" id="finalSmartTitle" readonly style="background:transparent; border:none; color:#fff; font-weight:bold; font-size:14px; margin:0; padding:0;">
                            </div>

                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                                <div><label>Link (Server)</label><input type="text" id="genLink" placeholder="Stream Link..."></div>
                                <div><label>Download Link</label><input type="text" id="genDL" placeholder="Download Link..."></div>
                            </div>

                            <button onclick="addToExcelList()" class="btn-cyan" style="margin-top:15px;"><i class="fa-solid fa-plus"></i> ADD TO LIST</button>
                        </div>

                        <div style="margin-top:20px;">
                            <h4 style="color:var(--gold);">ADDED LIST (<span id="excelCount">0</span>)</h4>
                            <div id="excelPreview" style="max-height:300px; overflow-y:auto; border:1px solid #333; border-radius:10px; padding:10px; background:#000;">
                                <div style="text-align:center; color:#555; padding:20px;">List is Empty</div>
                            </div>
                        </div>

                        <button onclick="downloadGeneratedExcel()" class="btn-cyan" style="margin-top:20px; background:var(--gold); color:black;">
                            <i class="fa-solid fa-download"></i> DOWNLOAD EXCEL FILE
                        </button>
                    </div>
                </div>
            </div>
         

            <div id="upload" class="tab-content" style="display:none;">
                <div class="rgb-border" style="margin-bottom:15px;">
                    <div class="inner-panel">
                        <label style="color:var(--cyan); font-weight:bold; margin-bottom:10px; display:block;">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> AUTO FILL AI (TMDB)
                        </label>
                        <div style="display:flex; gap:10px; align-items: center;">
                            <input type="text" id="tmdbQuery" placeholder="Movie Name or ID..." style="margin:0; flex:2;">
                            <button onclick="fetchHybrid()" class="btn-cyan" style="width:auto; flex:1; padding:12px; font-size:14px;">
                                FETCH
                            </button>
                        </div>
                    </div>
                </div>

                <div class="rgb-border" style="border-color:var(--gold) !important; margin-bottom:20px;">
                    <div class="inner-panel" style="text-align:center;">
                        <label style="color:var(--gold); font-weight:bold; display:block; margin-bottom:10px;">
                            <i class="fa-solid fa-file-excel"></i> BULK UPLOAD (EXCEL)
                        </label>
                        <div style="border: 1px dashed var(--gold); padding: 10px; border-radius: 10px;">
                            <input type="file" onchange="handleBulkUpload(this)" accept=".xlsx, .xls" style="border:none; padding:0; margin:0; width:100%; color:#aaa;">
                        </div>
                        <small style="color:#666; display:block; margin-top:5px; font-size:10px;">
                            Format: Title, Year, Type, Poster, Link1
                        </small>
                    </div>
                </div>
                
                <div class="inner-panel" style="border:1px solid #222;">
                    <input type="hidden" id="editId"><input type="hidden" id="tmdbId"> 
                    
                    <div style="display:grid; grid-template-columns: 100px 1fr; gap:20px;">
                        <div>
                            <img id="posterPreview" src="" style="width:100%; border-radius:10px; min-height:150px; background:#111; object-fit:cover;">
                            <label style="margin-top:10px; font-size:10px; color:var(--cyan);">QUALITY TAG</label>
                            <select id="lQual" style="padding:5px; margin-bottom:5px;">
                                <option value="4K UHD">4K UHD</option>
                                <option value="1080p FHD">1080p FHD</option>
                                <option value="720p HD" selected>720p HD</option>
                                <option value="480p SD">480p SD</option>
                                <option value="WEB-DL">WEB-DL</option>
                                <option value="BluRay">BluRay</option>
                                <option value="HDRip">HDRip</option>
                                <option value="IMAX">IMAX</option>
                                <option value="Dual Audio">Dual Audio</option>
                            </select>
                            <div class="toggle-container" style="margin-top:5px;">
                                <label style="margin:0; font-size:9px;">FEATURED</label>
                                <label class="switch"><input type="checkbox" id="isFeatured"><span class="slider"></span></label>
                            </div>
                        </div>
                        <div>
                            <div style="display: flex; gap: 10px;">
                                <div style="flex: 2;"><label>Title</label><input type="text" id="mTitle"></div>
                                <div style="flex: 1;"><label>Year</label><input type="text" id="mYear" placeholder="2024"></div>
                            </div>
                            <div><label><i class="fa-brands fa-youtube" style="color:red;"></i> Trailer Link (Auto)</label><input type="text" id="mTrailer"></div>
                            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px;">
                                <div><label class="badge-omdb">IMDb</label><input type="text" id="mRating" placeholder="8.5"></div>
                                <div><label class="badge-rt">Rotten</label><input type="text" id="rtRating" placeholder="90%"></div>
                                <div><label style="background:#000; color:#fff; font-size:10px;">Meta</label><input type="text" id="metaRating" placeholder="80"></div>
                            </div>
                            <label style="color:#00ff00;">Genres (Auto)</label><input type="text" id="mGenre" style="border-color:#00ff00;">
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                                <div><label>Type</label><select id="mType" onchange="toggleTypeUI()"><option value="movie">Movie</option><option value="series">Web Series</option></select></div>
                                <div id="seasonBox" style="display:none;">
                                    <label>Season</label>
                                    <div class="ctrl-group">
                                        <input type="number" id="mSeason" value="1">
                                        <button class="ctrl-btn" onclick="inc('mSeason')">+</button>
                                    </div>
                                </div>
                            </div>
                            <div style="margin-top:10px;">
                                <label>Domain Lock</label>
                                <input type="text" id="domainLock" placeholder="yoursite.com" style="border-color:var(--red);">
                            </div>
                        </div>
                    </div>

                    <input type="hidden" id="mBackdrop">
                    <label style="margin-top:15px;">Description</label><textarea id="mDesc" style="height:70px;"></textarea>
                    
                    <div style="background:#000; border:2px dashed var(--cyan); padding:15px; border-radius:15px; margin-top:15px;">
                        <h4 style="color:var(--cyan); margin-top:0;">ADD VIDEO SOURCE</h4>
                        <div style="display:flex; gap:10px; margin-bottom:10px;">
                            <div id="epBox" style="display:none; flex:1;">
                                <label>Episode</label>
                                <div class="ctrl-group">
                                    <input type="number" id="epNum" value="1">
                                    <button class="ctrl-btn" onclick="inc('epNum')">+</button>
                                </div>
                            </div>
                            <div style="flex:2;">
                                <label>Link Quality</label>
                                <select id="linkQual" style="margin:0;">
                                    <option>4K</option><option>1080p</option><option>720p</option><option>480p</option>
                                    <option>HDRip</option><option>BluRay</option><option>Dual Audio</option>
                                </select>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px;">
                            <div><label>Server 1 (Auto)</label><input type="text" id="server1" placeholder="Auto VidSrc Link..." style="color:#0f0;"></div>
                            <div><label>Server 2 (Auto)</label><input type="text" id="server2" placeholder="Auto 2Embed Link..." style="color:#0f0;"></div>
                        </div>
                        
                        <label style="color:var(--gold); margin-top:10px; display:block;">Download Source</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="dlLink" placeholder="Paste CineFreak/Other Link here..." style="flex:1;">
                            <button onclick="openCineFreak()" class="btn-cyan" style="width:auto; padding:0 15px; background:var(--gold); color:black; font-size:12px;">
                                <i class="fa-solid fa-magnifying-glass"></i> SEARCH CF
                            </button>
                        </div>

                        <div><label>Watch Link (Manual)</label><input type="text" id="watchLink" placeholder="Manual Watch Link..."></div>

                        <div style="display:flex; justify-content:space-between; margin-top:10px;">
                            <button id="btnFetchEP" onclick="fetchEpisodeInfo()" class="btn-cyan" style="width:auto; font-size:10px; padding:5px 15px; background:var(--gold); color:black; display:none;"><i class="fa-solid fa-bolt"></i> FETCH EP INFO</button>
                            <button onclick="addMultiServerLink()" class="btn-cyan" style="width:auto; padding:10px 30px;"><i class="fa-solid fa-plus"></i> ADD SOURCE</button>
                        </div>
                    </div>
                    <div id="linkContainer" style="margin-top:15px;"></div>
                    <div style="display:flex; gap:15px; margin-top:25px;">
                        <button onclick="triggerReset()" class="btn-cyan" style="background:transparent; border:2px solid #555; color:#aaa;">RESET</button>
                        <button onclick="publish()" class="btn-cyan">PUBLISH CONTENT</button>
                    </div>
                </div>
            </div>

            <div id="database" class="tab-content" style="display:none;">
                <div class="rgb-border"><div class="inner-panel">
                    <input type="text" id="dbSearch" placeholder="Search Database..." onkeyup="renderDB()">
                    <div id="dbList" style="margin-top:20px;"></div>
                </div></div>
            </div>
            
                       <div id="automation" class="tab-content" style="display:none;">
                <div class="rgb-border" style="border-color:var(--cyan) !important;">
                    <div class="inner-panel">
                        <label style="color:var(--cyan); font-weight:bold; font-size:18px;">
                            <i class="fa-solid fa-robot"></i> SYSTEM AUTO SCANNER
                        </label>
                        
                        <div style="background:#111; padding:20px; border-radius:15px; margin-top:15px; border:1px solid #333; text-align:center;">
                            <i class="fa-solid fa-heart-pulse" style="font-size:40px; color:var(--red); margin-bottom:10px;"></i>
                            <h3 style="margin:0; color:#fff;">BROKEN LINK FINDER (PRO)</h3>
                            <p style="color:#aaa; font-size:12px; margin-bottom:20px;">
                                Deep Scan your database for dead links, missing content, and server errors.
                            </p>
                            
                            <button onclick="startAutoScan()" class="btn-cyan" style="background:var(--red); color:#fff; border:none; box-shadow: 0 0 15px rgba(255,0,68,0.4);">
                                <i class="fa-solid fa-radar"></i> START DEEP SCAN
                            </button>
                        </div>

                        <div style="margin-top:20px; border-top:1px solid #333; padding-top:20px;">
                            <label><i class="fa-brands fa-telegram"></i> Telegram Bot Config</label>
                            <input type="text" id="tgToken" placeholder="Bot Token">
                            <input type="text" id="tgChatId" placeholder="Channel ID (-100xxxx)">
                            <button onclick="saveSettings()" class="btn-cyan" style="width:auto; font-size:12px;">SAVE CONFIG</button>
                        </div>

                    </div>
                </div>
            </div>
            
            <div id="inbox" class="tab-content" style="display:none;">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div class="rgb-border" style="border-color:var(--red) !important;"><div class="inner-panel"><label style="color:var(--red);">REPORTS</label><div id="reportList" style="height:400px; overflow-y:auto; margin-top:10px;"></div></div></div>
                    <div class="rgb-border" style="border-color:var(--gold) !important;"><div class="inner-panel"><label style="color:var(--gold);">REQUESTS</label><div id="requestList" style="height:400px; overflow-y:auto; margin-top:10px;"></div></div></div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="script.js"></script>

</body>
</html>
